<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>農工大弓道部</title>
<meta name="theme-color" content="#1a2744">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/k2-192.png">
<link rel="apple-touch-icon" href="icons/k2-apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="弓道部">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1a2744;overflow:hidden}
  body{font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;color:#fff}
  #app{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top,0px);width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:#f0eeeb}
  .layer{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#1a2744;padding:24px;text-align:center;z-index:10}
  .layer[hidden]{display:none}
  [hidden]{display:none !important} /* style に display を書いた要素も、hidden で確実に隠す */
  .layer img{width:88px;height:88px;border-radius:20px}
  .ttl{font-size:18px;font-weight:700}
  .sub{font-size:13px;color:rgba(255,255,255,.75);line-height:1.7}
  .msg{font-size:13px;color:#fecaca;line-height:1.6;min-height:1.6em;max-width:320px}
  .btn{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:10px 22px;font-size:14px;cursor:pointer}
  #gbtn{min-height:44px}
</style>
</head>
<body>
<!-- credentialless: スマホに入っているGoogleアカウントの情報をアプリ本体に送らない
     （大学アカウントの組織設定や複数ログインで「ファイルを開くことができません」になるのを防ぐ） -->
<iframe id="app" title="農工大弓道部" allow="microphone; clipboard-write" credentialless></iframe>
<div id="dbg" hidden style="position:fixed;left:0;right:0;bottom:0;max-height:40%;overflow:auto;background:rgba(0,0,0,.85);color:#a7f3d0;font:11px/1.5 monospace;padding:6px 8px;z-index:50;white-space:pre-wrap"></div>

<div class="layer" id="splash">
  <img src="icons/k2-192.png" alt="">
  <div class="ttl">農工大弓道部</div>
  <div class="sub" id="splash-sub">読み込み中…</div>
  <button class="btn" id="splash-retry" hidden onclick="reloadApp()">再読み込み</button>
  <div class="sub" id="splash-diag" style="font-size:11px;color:rgba(255,255,255,.5)"></div>
</div>

<div class="layer" id="login" hidden>
  <img src="icons/k2-192.png" alt="">
  <div class="ttl">農工大弓道部</div>
  <div class="sub">大学のGoogleアカウント<br>（@st.go.tuat.ac.jp）でログインしてください</div>
  <div id="gbtn"></div>
  <div class="msg" id="login-msg"></div>
</div>

<div class="layer" id="pushask" hidden style="background:rgba(10,18,40,.94)">
  <img src="icons/k2-192.png" alt="">
  <div class="ttl" id="pushask-title">通知を受け取りますか？</div>
  <div class="sub">部室の返信・アドバイス、お知らせ、<br>道場当番の前の連絡が、この端末に届きます。<br>届く内容はアプリの「設定」で選べます。</div>
  <button class="btn" style="background:#fff;color:#1a2744;font-weight:700;padding:12px 28px" onclick="pushSubscribe()">通知を受け取る</button>
  <button class="btn" onclick="pushLater()">あとで</button>
</div>

<div id="installbar" hidden style="position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:20;background:#111;color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:13px;line-height:1.5">
  <img src="icons/k2-192.png" alt="" style="width:36px;height:36px;border-radius:8px;flex-shrink:0">
  <div id="installbar-text" style="flex:1;min-width:0"></div>
  <button class="btn" id="installbar-btn" style="background:#fff;color:#111;font-weight:700;padding:8px 14px;flex-shrink:0" onclick="doInstall()">インストール</button>
  <button class="btn" style="background:transparent;padding:6px 8px;flex-shrink:0" onclick="closeInstall()" aria-label="閉じる">✕</button>
</div>

<div class="layer" id="offline" hidden>
  <img src="icons/k2-192.png" alt="">
  <div class="ttl">オフラインです</div>
  <div class="sub">電波の良い場所で、もう一度お試しください</div>
  <button class="btn" onclick="reloadApp()">再試行</button>
</div>

<script>
/* ================================================================
   農工大弓道部アプリ 外枠（ホーム画面アプリ / PWA）
   ・Googleログインはこのページで行い、アプリ本体（GAS）には合言葉を渡す
   ・アプリ本体は下の APP_URL を iframe で表示する
   設定するのは CONFIG の APP_URL だけ（README参照）
================================================================ */
const CONFIG = {
  APP_URL: 'https://script.google.com/macros/s/AKfycbzbtPWtNLNIEYM-0sU4qwO6D-orWw_G1FQkbKb84Giii2zU7i4pnpkmH9ng-p_qzFgB/exec',
  CLIENT_ID: '273532915557-obdrl7l2kpaq2dsnuo35k44rph34d5ar.apps.googleusercontent.com',
  // アプリ本体（GASの画面）が動く住所。GASは googleusercontent.com の中で動く
  APP_ORIGIN: /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/
};
const SKEY = 'kyudo_session';
const APFX = 'app:'; // アプリ本体から頼まれて保存する物の印
const frame = document.getElementById('app');
let appWin = null, appOrigin = '', gsiReady = false, splashTimer = null;
// 開けない時の原因調査用（「時間がかかっています」の下に表示する）
const diag = { load: 0, got: [], ng: [], err: [] };
const DEBUG = /[?&]debug=1/.test(location.search); // URLの末尾に ?debug=1 を付けると画面下に記録を出す
frame.addEventListener('load', () => { diag.load++; logDbg('iframe load'); });
function logDbg(t){
  if(!DEBUG) return;
  const d = $('dbg'); d.hidden = false;
  d.textContent += new Date().toLocaleTimeString() + ' ' + t + '\n'; d.scrollTop = d.scrollHeight;
}
function showDiag(){
  $('splash-diag').textContent = '診断: 読込' + diag.load + '回 / 受信 ' + (diag.got.slice(-6).join(',') || 'なし') +
    ' / 拒否 ' + (diag.ng.join(',') || 'なし') + ' / ' + (navigator.onLine ? 'オンライン' : 'オフライン') +
    ' / ' + ('credentialless' in HTMLIFrameElement.prototype ? 'CL対応' : 'CL非対応') +
    (diag.err.length ? ' / エラー ' + diag.err.slice(-2).join(' | ') : '');
}
/* アプリ本体の保存内容（外枠の端末保存に置いておく） */
function appStore(){
  const o = {};
  try{
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(APFX) === 0) o[k.slice(APFX.length)] = localStorage.getItem(k);
    }
  }catch(e){}
  return o;
}
function appStoreSet(k, v){
  if(typeof k !== 'string' || !k || k.length > 100) return;
  try{ v == null ? localStorage.removeItem(APFX + k) : localStorage.setItem(APFX + k, String(v)); }
  catch(e){ // 容量オーバー：大きいキャッシュだけ諦める（データ本体はサーバーにある）
    if(k === 'kudo_cache'){ try{ localStorage.removeItem(APFX + k); }catch(_){} }
    logDbg('store失敗 ' + k);
  }
}
function appStoreClear(){ Object.keys(appStore()).forEach(k => { try{ localStorage.removeItem(APFX + k); }catch(e){} }); }

function $(id){ return document.getElementById(id); }
function getSession(){ try{ return localStorage.getItem(SKEY) || ''; }catch(e){ return ''; } }
function setSession(v){ try{ v ? localStorage.setItem(SKEY, v) : localStorage.removeItem(SKEY); }catch(e){} }

/* アプリ本体を読み込む */
function reloadApp(){
  if(!navigator.onLine){ $('offline').hidden = false; return; }
  $('offline').hidden = true; $('splash').hidden = false;
  $('splash-sub').textContent = '読み込み中…'; $('splash-retry').hidden = true;
  clearTimeout(splashTimer);
  splashTimer = setTimeout(() => { // 長くかかっている時は再読み込みを出す
    $('splash-sub').textContent = '時間がかかっています…'; $('splash-retry').hidden = false; showDiag();
  }, 20000);
  frame.src = CONFIG.APP_URL + (CONFIG.APP_URL.indexOf('?') >= 0 ? '&' : '?') + 'shell=1';
}
function hideSplash(){ clearTimeout(splashTimer); $('splash').hidden = true; }

/* 送り主が、このページの iframe の中のアプリ本体かを確かめる */
function fromOurApp(ev){
  if(!CONFIG.APP_ORIGIN.test(ev.origin)) return false;
  let w = ev.source;
  for(let i = 0; i < 4 && w; i++){
    if(w === frame.contentWindow) return true;
    try{ if(w === w.parent) break; w = w.parent; }catch(e){ return false; }
  }
  return false;
}
function send(m){ if(appWin) appWin.postMessage(Object.assign({ kyudo: 1 }, m), appOrigin); }

window.addEventListener('message', ev => {
  const m = ev.data;
  if(!m || m.kyudo !== 1) return;
  if(!fromOurApp(ev)){ diag.ng.push(ev.origin); logDbg('拒否 ' + ev.origin); return; }
  diag.got.push(m.type);
  if(m.type !== 'store') logDbg('受信 ' + m.type + (m.message ? ' ' + m.message : ''));
  appWin = ev.source; appOrigin = ev.origin;
  switch(m.type){
    case 'hello':         hideSplash(); send({ type: 'auth', session: getSession(), store: appStore() }); setTimeout(maybeShowInstall, 4000); break;
    case 'store':         appStoreSet(m.key, m.value); break;
    case 'error':         diag.err.push(String(m.message || '').slice(0, 120)); break;
    case 'need-login':    showLogin(''); break;
    case 'session':       setSession(m.session); hideLogin(); break;
    case 'clear-session': setSession(''); break;
    case 'login-error':   showLogin(m.message || 'ログインできませんでした'); break;
    case 'push-status':   pushStatus(); break;
    case 'push-setup':    pushSetup(m); break;
    case 'push-off':      pushOff(); break;
    case 'logout':
      setSession(''); appStoreClear(); // 次に別の人が使っても前の人のデータが残らないように
      try{ google.accounts.id.disableAutoSelect(); }catch(e){}
      reloadApp(); break;
  }
});

/* ---- Googleログイン ---- */
function initGsi(){
  if(gsiReady) return true;
  if(!(window.google && google.accounts && google.accounts.id)) return false;
  google.accounts.id.initialize({
    client_id: CONFIG.CLIENT_ID,
    callback: r => {
      if(!r || !r.credential) return;
      $('login-msg').style.color = 'rgba(255,255,255,.8)';
      $('login-msg').textContent = '確認しています…';
      send({ type: 'idtoken', idToken: r.credential });
    },
    auto_select: true,          // 2回目からは自動でログイン
    itp_support: true,
    use_fedcm_for_prompt: true,
    cancel_on_tap_outside: false
  });
  google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', locale: 'ja', width: 260 });
  gsiReady = true;
  return true;
}
function showLogin(msg){
  hideSplash();
  $('login').hidden = false;
  $('login-msg').style.color = '#fecaca';
  $('login-msg').textContent = msg || '';
  const tryInit = (n) => {
    if(initGsi()){ try{ google.accounts.id.prompt(); }catch(e){} return; }
    if(n > 100){ $('login-msg').textContent = 'ログイン部品を読み込めませんでした。再読み込みしてください。'; return; }
    setTimeout(() => tryInit(n + 1), 150);
  };
  tryInit(0);
}
function hideLogin(){ $('login').hidden = true; }

/* ---- アプリの通知（プッシュ） ----
   通知の許可と端末の登録はこのページ（ホーム画面アプリ本体）で行う。
   登録した宛先はアプリ本体に渡し、サーバーに保存してもらう。 */
const PUSH_ASKED = 'push_asked_at', PUSH_SYNCED = 'push_synced_at';
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const pushSupported = () => ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
let pushKey = '';
function within(p, ms){ return Promise.race([p, new Promise((_, rj) => setTimeout(() => rj(new Error('timeout')), ms))]); }
function lsNum(k){ try{ return +localStorage.getItem(k) || 0; }catch(e){ return 0; } }
function lsSet(k, v){ try{ localStorage.setItem(k, String(v)); }catch(e){} }
function b64uToU8(s){
  s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '==='.slice((s.length + 3) % 4);
  const b = atob(s), u = new Uint8Array(b.length);
  for(let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
}
function sameKey(sub, key){
  try{
    const a = new Uint8Array(sub.options.applicationServerKey);
    return a.length === key.length && a.every((x, i) => x === key[i]);
  }catch(e){ return true; }
}
function deviceName(){
  const ua = navigator.userAgent;
  const os = isIOS ? 'iPhone' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'その他';
  return os + (isStandalone() ? '・アプリ' : '・ブラウザ');
}
async function pushStatus(){
  const o = { type: 'push-status', supported: pushSupported(), ios: isIOS, standalone: isStandalone(),
    permission: ('Notification' in window) ? Notification.permission : 'unsupported',
    subscribed: false, recentlyAsked: Date.now() - lsNum(PUSH_ASKED) < 14 * 864e5, resync: false, device: deviceName() };
  if(o.supported){
    try{
      const reg = await within(navigator.serviceWorker.ready, 6000);
      const sub = await reg.pushManager.getSubscription();
      if(sub){
        o.subscribed = true; o.sub = sub.toJSON();
        if(Date.now() - lsNum(PUSH_SYNCED) > 7 * 864e5){ o.resync = true; lsSet(PUSH_SYNCED, Date.now()); }
      }
    }catch(e){ o.supported = false; }
  }
  send(o);
}
function pushSetup(m){
  pushKey = m.publicKey || '';
  if(!pushKey || !pushSupported()) return;
  if(m.silent && Notification.permission === 'granted'){ pushSubscribe(true); return; } // 許可済みなら黙って登録
  $('pushask-title').textContent = m.offer ? '通知を受け取りますか？' : 'この端末で通知を受け取る';
  hideSplash(); $('pushask').hidden = false;
}
async function pushSubscribe(silent){
  $('pushask').hidden = true;
  try{
    // 許可の確認は、ボタンを押した直後に行う必要がある（iPhone）
    const perm = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    if(perm !== 'granted'){
      lsSet(PUSH_ASKED, Date.now());
      send({ type: 'push-result', ok: false, message: perm === 'denied' ? '通知がブロックされました。端末の設定から許可できます' : '通知はオフのままです' });
      return;
    }
    const reg = await within(navigator.serviceWorker.ready, 8000);
    const key = b64uToU8(pushKey);
    let sub = await reg.pushManager.getSubscription();
    if(sub && !sameKey(sub, key)){ await sub.unsubscribe(); sub = null; } // 送信元の鍵が変わっていたら登録し直す
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
    lsSet(PUSH_SYNCED, Date.now());
    send({ type: 'push-sub', sub: sub.toJSON(), device: deviceName(), quiet: !!silent });
  }catch(e){
    if(!silent) send({ type: 'push-result', ok: false, message: '通知の登録に失敗しました（' + ((e && e.message) || e) + '）' });
  }
}
function pushLater(){
  $('pushask').hidden = true; lsSet(PUSH_ASKED, Date.now());
  send({ type: 'push-result', ok: false, message: '' });
}
async function pushOff(){
  try{
    const reg = await within(navigator.serviceWorker.ready, 6000);
    const sub = await reg.pushManager.getSubscription();
    if(sub){ const ep = sub.endpoint; await sub.unsubscribe(); send({ type: 'push-unsub', endpoint: ep }); return; }
  }catch(e){}
  send({ type: 'push-unsub', endpoint: '' });
}

/* ---- アプリとしてインストール（ショートカットではなく、通知が届くアプリにする） ---- */
let bip = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); bip = e; setTimeout(maybeShowInstall, 1500); });
window.addEventListener('appinstalled', () => { $('installbar').hidden = true; bip = null; });
function maybeShowInstall(){
  if(isStandalone() || !appWin) return;                       // もうアプリとして開いている／まだ読み込み中
  if(Date.now() - lsNum('install_closed') < 7 * 864e5) return; // 閉じてから1週間は出さない
  const ua = navigator.userAgent;
  let text = '', btn = false;
  if(bip){ text = 'アプリとしてインストールすると、通知が届くようになります'; btn = true; }
  else if(isIOS){ text = '共有ボタン →「ホーム画面に追加」で、アプリとして使えます（「Webアプリとして開く」をオンに）'; }
  else if(/ Line\/|FBAN|FBAV|Instagram/.test(ua)){ text = 'この画面ではインストールできません。右上のメニューから「ブラウザで開く」を選んでください'; }
  else return;
  $('installbar-text').textContent = text;
  $('installbar-btn').hidden = !btn;
  $('installbar').hidden = false;
}
async function doInstall(){
  if(!bip) return;
  bip.prompt();
  try{ const r = await bip.userChoice; if(r && r.outcome === 'accepted') $('installbar').hidden = true; }catch(e){}
  bip = null;
}
function closeInstall(){ $('installbar').hidden = true; lsSet('install_closed', Date.now()); }

/* ---- オフライン ---- */
window.addEventListener('online', () => { if(!$('offline').hidden) reloadApp(); });
window.addEventListener('offline', () => { if(!appWin) $('offline').hidden = false; });

/* ---- PWA（オフラインでも外枠だけは開けるようにする） ---- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

reloadApp();
</script>
<script src="https://accounts.google.com/gsi/client" async></script>
</body>
</html>
